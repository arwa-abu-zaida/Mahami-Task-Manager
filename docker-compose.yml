services:
  mahami:
    build:
      context: .
      dockerfile: Dockerfile
    image: mahami-task-manager:latest
    container_name: mahami-task-manager
    ports:
      - "8000:8000"
    environment:
      APP_NAME: Mahami
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stderr
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - mahami_database:/var/www/html/database
      - mahami_storage:/var/www/html/storage
    restart: unless-stopped

volumes:
  mahami_database:
  mahami_storage:
